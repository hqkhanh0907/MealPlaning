name: Leptos dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/leptos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: rustup toolchain install 1.100.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Install the pinned WebAssembly bindings generator
        run: |
          archive="wasm-bindgen-0.2.130-x86_64-unknown-linux-musl"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/$archive.tar.gz" -o "$RUNNER_TEMP/$archive.tar.gz"
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP" "$archive/wasm-bindgen"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - run: cargo fmt --manifest-path crates/healthmate-leptos/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/healthmate-leptos/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo clippy --manifest-path crates/healthmate-leptos/Cargo.toml --locked --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --manifest-path crates/healthmate-leptos/Cargo.toml --locked
      - run: npm run test:leptos
      - run: node crates/healthmate-leptos/tests/browser.mjs
        env:
          LEPTOS_PKG: ${{ github.workspace }}/target/leptos-web
          CHROME_BIN: google-chrome
      - run: npm run build:leptos
