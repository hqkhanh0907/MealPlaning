name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify PocketBase download and run backend checks
        run: |
          curl -fsSL https://github.com/pocketbase/pocketbase/releases/download/v0.40.6/pocketbase_0.40.6_linux_amd64.zip -o "$RUNNER_TEMP/pocketbase.zip"
          echo "0e1f609158ed945f809f8a02ae012aa0427129c66ebb63c1aee76f2c0309373f  $RUNNER_TEMP/pocketbase.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/pocketbase.zip" -d "$RUNNER_TEMP/pocketbase"
          POCKETBASE_BIN="$RUNNER_TEMP/pocketbase/pocketbase" node --test server/tests/pocketbase/*.test.mjs

      - name: Verify Rust import from the PocketBase database
        run: |
          rustup toolchain install 1.100.1 --profile minimal
          POCKETBASE_BIN="$RUNNER_TEMP/pocketbase/pocketbase" cargo test --locked -p healthmate-server imports_real_pocketbase -- --ignored

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run architecture guards (PC-1, Style 2025, form-pattern, design-tokens)
        run: npm run check:guards

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Compare SQLite upgrades with the original TypeScript migrations
        run: cargo test --locked -p healthmate-store --test legacy_database -- --ignored

      - name: Build web app
        run: npm run build

  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs: test-and-build

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build Android test APK
        run: |
          npm run build:prod
          npx cap add android
          npx cap sync android
          android/gradlew -p android testDebugUnitTest assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android offline workflows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ADB: adb
          ANDROID_SERIAL: emulator-5554
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          emulator-options: -no-snapshot -no-audio -no-window -no-boot-anim -gpu swiftshader_indirect -memory 3072
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash e2e/run-android-ci.sh

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: ${{ runner.temp }}/mealplan-workout-acceptance
          retention-days: 7
