name: Rust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust.yml'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'server/**'
      - 'src/assets/seed/**'
  pull_request:
    paths:
      - '.github/workflows/rust.yml'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'server/**'
      - 'src/assets/seed/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install 1.100.1 --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
