[package]
name = "healthmate-domain"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.1"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
