[package]
name = "healthmate-client-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.1"
publish = false

[dependencies]
healthmate-protocol = { path = "../healthmate-protocol" }
healthmate-store = { path = "../healthmate-store" }
indexmap = "2"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
