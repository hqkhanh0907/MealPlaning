[package]
name = "healthmate-capacitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.1"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
healthmate-store = { path = "../healthmate-store" }
healthmate-domain = { path = "../healthmate-domain" }
serde_json = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
rusqlite = { version = "=0.43.0", features = ["bundled"] }

[target.'cfg(target_os = "android")'.dependencies]
rusqlite = { version = "=0.43.0", features = ["sqlcipher"] }
jni = "=0.21.1"

[dev-dependencies]
tempfile = "3"

[workspace]
