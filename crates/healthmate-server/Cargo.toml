[package]
name = "healthmate-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.1"

[dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
chrono = "0.4.45"
healthmate-protocol = { path = "../healthmate-protocol" }
hex = "0.4.3"
http-body-util = "0.1.3"
rand = "0.8.5"
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
