[package]
name = "healthmate-leptos"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.1"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
healthmate-domain = { path = "../healthmate-domain" }
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.8.23", features = ["csr"] }
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
wasm-bindgen-futures = "=0.4.80"
web-sys = { version = "=0.3.107", features = ["Window","Element","HtmlElement","HtmlSelectElement","HtmlInputElement","ScrollIntoViewOptions","ScrollLogicalPosition","FocusOptions","MouseEvent","CustomEvent","Event","EventTarget"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptos = { version = "=0.8.23", features = ["ssr"] }
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["HtmlSelectElement","HtmlInputElement","MouseEvent","CustomEvent","Event","EventTarget"] }
wasm-bindgen = "=0.2.130"

[workspace]
