# SonarQube/SonarCloud Configuration — HealthMate AI
# Run: sonar-scanner (or via CI pipeline)

sonar.projectKey=healthmate-ai
sonar.projectName=HealthMate AI
sonar.projectVersion=0.0.1

# Source
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.language=ts

# TypeScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=\
  node_modules/**,\
  www/**,\
  dist/**,\
  android/**,\
  coverage/**,\
  src/assets/**,\
  src/environments/**,\
  **/*.spec.ts,\
  **/*.d.ts,\
  karma.conf.js,\
  src/test.ts,\
  src/polyfills.ts,\
  src/zone-flags.ts

# Test files
sonar.test.inclusions=**/*.spec.ts
sonar.tests=src

# Coverage exclusions (same as source exclusions + test files)
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.d.ts,\
  src/main.ts,\
  src/test.ts,\
  src/polyfills.ts,\
  src/zone-flags.ts,\
  src/environments/**

# Duplication exclusions
sonar.cpd.exclusions=\
  **/*.spec.ts,\
  src/app/core/services/database/schema.ts
