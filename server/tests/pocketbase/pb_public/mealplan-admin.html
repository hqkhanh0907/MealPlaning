<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trạng thái vận hành MealPlaning.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'">
  <title>Vận hành MealPlaning</title>
  <link rel="stylesheet" href="mealplan-admin.css">
  <script type="module" src="mealplan-admin.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="frame site-header-inner">
      <span class="wordmark">MealPlaning</span>
      <span class="site-section">Vận hành</span>
      <button id="logout" class="secondary" type="button" hidden>Đăng xuất</button>
    </div>
  </header>

  <main class="frame">
    <section id="sign-in" class="sign-in" aria-labelledby="sign-in-title">
      <div>
        <h1 id="sign-in-title">Đăng nhập vận hành</h1>
        <p>Dùng tài khoản vận hành để xem trạng thái dịch vụ.</p>
      </div>
      <form id="login" class="sign-in-form">
        <div class="input-wrapper">
          <label class="input-label" for="operator-email">Email</label>
          <input id="operator-email" class="input-native" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="input-wrapper">
          <label class="input-label" for="operator-password">Mật khẩu</label>
          <input id="operator-password" class="input-native" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="login-feedback" class="feedback" role="status"></p>
        <button id="sign-in-submit" type="submit">Đăng nhập</button>
      </form>
    </section>

    <section id="status" aria-labelledby="status-title" hidden>
      <div class="status-heading">
        <div>
          <h1 id="status-title" tabindex="-1">Trạng thái hệ thống</h1>
          <p id="refresh-feedback" role="status"></p>
        </div>
        <button id="refresh" class="secondary" type="button">Làm mới</button>
      </div>

      <div class="metrics">
        <section class="panel" aria-labelledby="services-title">
          <h2 id="services-title">Dịch vụ</h2>
          <dl class="metrics-list">
            <div><dt>API</dt><dd id="api-state">—</dd></div>
            <div><dt>Cơ sở dữ liệu</dt><dd id="database-state">—</dd></div>
            <div><dt>SHA triển khai</dt><dd><code id="release">—</code></dd></div>
          </dl>
        </section>

        <section class="panel" aria-labelledby="sync-title">
          <h2 id="sync-title">Đồng bộ</h2>
          <dl class="metrics-list">
            <div><dt>Lần gửi thành công gần nhất</dt><dd id="last-upload">—</dd></div>
            <div><dt>Lần nhận thành công gần nhất</dt><dd id="last-download">—</dd></div>
          </dl>
        </section>
      </div>

      <section class="panel failures" aria-labelledby="failures-title">
        <h2 id="failures-title">Lỗi đồng bộ</h2>
        <ul id="failures" class="events" aria-label="Các nhóm lỗi"></ul>
      </section>
    </section>
  </main>
</body>
</html>
