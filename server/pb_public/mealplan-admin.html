<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản trị MealPlaning</title>
  <link rel="stylesheet" href="mealplan-admin.css">
  <script type="module" src="mealplan-admin.js"></script>
</head>
<body>
  <main>
    <h1>Quản trị MealPlaning</h1>
    <form id="login">
      <label>Email quản trị <input name="email" type="email" autocomplete="username" required></label>
      <label>Mật khẩu <input name="password" type="password" autocomplete="current-password" required></label>
      <button>Đăng nhập</button>
    </form>
    <p id="status" role="status"></p>
    <section id="data" hidden>
      <div class="filters">
        <label>Tài khoản <select id="accounts"></select></label>
        <label>Bảng <select id="tables"></select></label>
        <button id="logout">Đăng xuất</button>
      </div>
      <div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div>
      <form id="edit" hidden>
        <label>Bản ghi <textarea id="record" rows="13" spellcheck="false" required></textarea></label>
        <button>Lưu bản ghi</button>
      </form>
    </section>
  </main>
</body>
</html>
