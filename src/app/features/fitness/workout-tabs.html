<ion-tabs class="apple-tab-bar">
  <ion-tab-bar slot="bottom" aria-label="Tập luyện">
    <ion-tab-button tab="today" data-testid="workout-tab-today">
      <ion-icon name="barbell-outline" aria-hidden="true" /><ion-label>Hôm nay</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="plans" data-testid="workout-tab-plans">
      <ion-icon name="calendar-outline" aria-hidden="true" /><ion-label>Giáo án</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="exercises" data-testid="workout-tab-exercises">
      <ion-icon name="library-outline" aria-hidden="true" /><ion-label>Bài tập</ion-label>
    </ion-tab-button>
    <ion-tab-button tab="history" data-testid="workout-tab-history">
      <ion-icon name="time-outline" aria-hidden="true" /><ion-label>Lịch sử</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
