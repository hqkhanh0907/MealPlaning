<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/settings" />
    </ion-buttons>
    <ion-title>Cơ thể</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-content">
    <app-form-field
      label="Chiều cao (cm)"
      inputId="body-field-height"
      errorId="err-body-height"
      [invalid]="heightInvalid()"
      errorMessage="Chiều cao cần từ 100 đến 250 cm"
    >
      <input
        id="body-field-height"
        class="input-native"
        type="number"
        inputmode="decimal"
        step="0.1"
        [attr.aria-invalid]="heightInvalid() ? 'true' : null"
        [attr.aria-describedby]="heightInvalid() ? 'err-body-height' : null"
        [ngModel]="height()"
        (ngModelChange)="height.set($event)"
      />
    </app-form-field>

    <app-form-field
      label="Cân nặng (kg)"
      inputId="body-field-weight"
      errorId="err-body-weight"
      [invalid]="weightInvalid()"
      errorMessage="Cân nặng cần từ 30 đến 300 kg"
    >
      <input
        id="body-field-weight"
        class="input-native"
        type="number"
        inputmode="decimal"
        step="0.1"
        [attr.aria-invalid]="weightInvalid() ? 'true' : null"
        [attr.aria-describedby]="weightInvalid() ? 'err-body-weight' : null"
        [ngModel]="weight()"
        (ngModelChange)="weight.set($event)"
      />
    </app-form-field>

    <app-form-field
      label="Tuổi"
      inputId="body-field-age"
      errorId="err-body-age"
      [invalid]="ageInvalid()"
      errorMessage="Tuổi cần từ 10 đến 120"
    >
      <input
        id="body-field-age"
        class="input-native"
        type="number"
        inputmode="numeric"
        [attr.aria-invalid]="ageInvalid() ? 'true' : null"
        [attr.aria-describedby]="ageInvalid() ? 'err-body-age' : null"
        [ngModel]="age()"
        (ngModelChange)="age.set($event)"
      />
    </app-form-field>

    <h3 class="section-caption">Giới tính</h3>
    <div
      class="segment-control segment-control--inverse-sage"
      role="radiogroup"
      aria-label="Giới tính"
    >
      <button
        type="button"
        class="segment-button"
        [class.selected]="gender() === 'male'"
        role="radio"
        [attr.aria-checked]="gender() === 'male'"
        (click)="gender.set('male')"
      >
        Nam
      </button>
      <button
        type="button"
        class="segment-button"
        [class.selected]="gender() === 'female'"
        role="radio"
        [attr.aria-checked]="gender() === 'female'"
        (click)="gender.set('female')"
      >
        Nữ
      </button>
    </div>

    @if (preview(); as r) {
      <h3 class="section-caption">Kết quả tính toán</h3>
      <div class="preview-card">
        <div class="preview-row">
          <span class="preview-label">BMR</span>
          <span class="preview-value">{{ r.bmr }} kcal</span>
        </div>
        <div class="preview-row">
          <span class="preview-label">TDEE</span>
          <span class="preview-value">{{ r.tdee }} kcal · {{ activityLabel() }}</span>
        </div>
        <div class="preview-row preview-row--accent">
          <span class="preview-label">Mục tiêu mới</span>
          <span class="preview-value"
            >Calo {{ r.target_calories }} kcal · Protein {{ r.target_protein }}g</span
          >
        </div>
        <p class="preview-hint">
          Nếu bạn đã chỉnh tay Calo/Protein, giá trị đã chỉnh sẽ được giữ nguyên.
        </p>
      </div>
    }
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="sticky-save-bar">
    <ion-button
      expand="block"
      class="save-button"
      [color]="formInvalid() ? 'medium' : 'primary'"
      [disabled]="formInvalid()"
      (click)="save()"
    >
      Lưu
    </ion-button>
  </div>
</ion-footer>
