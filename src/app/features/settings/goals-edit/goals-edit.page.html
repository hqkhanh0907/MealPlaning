<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/settings" text="" aria-label="Quay lại" />
    </ion-buttons>
    <ion-title>Mục tiêu</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-content">
    <div class="goal-list" role="radiogroup" aria-label="Mục tiêu">
      @for (opt of goalOptions; track opt.value) {
        <button
          type="button"
          class="goal-button goal-button--compact"
          [class.selected]="goal() === opt.value"
          role="radio"
          [attr.aria-checked]="goal() === opt.value"
          (click)="setGoal(opt.value)"
        >
          <span class="goal-button__label">{{ opt.label }}</span>
          @if (goal() === opt.value) {
            <ion-icon class="goal-button__check" name="checkmark-circle" aria-hidden="true" />
          }
        </button>
      }
    </div>

    <h3 class="section-caption">Chỉ số dinh dưỡng</h3>

    <app-form-field
      label="Calo (kcal)"
      inputId="goals-field-calo"
      errorId="err-goals-calo"
      [invalid]="caloInvalid()"
      errorMessage="Calo cần từ 800 đến 6000 kcal"
    >
      <input
        id="goals-field-calo"
        class="input-native"
        type="number"
        inputmode="numeric"
        [attr.aria-invalid]="caloInvalid() ? 'true' : null"
        [attr.aria-describedby]="caloInvalid() ? 'err-goals-calo' : null"
        [ngModel]="calo()"
        (ngModelChange)="setCalo($event)"
      />
    </app-form-field>

    <app-form-field
      label="Protein (g)"
      inputId="goals-field-protein"
      errorId="err-goals-protein"
      [invalid]="proteinInvalid()"
      errorMessage="Protein cần từ 20 đến 400 g"
    >
      <input
        id="goals-field-protein"
        class="input-native"
        type="number"
        inputmode="numeric"
        [attr.aria-invalid]="proteinInvalid() ? 'true' : null"
        [attr.aria-describedby]="proteinInvalid() ? 'err-goals-protein' : null"
        [ngModel]="protein()"
        (ngModelChange)="setProtein($event)"
      />
    </app-form-field>

    <app-form-field
      label="Carbs (g/ngày)"
      inputId="goals-field-carbs"
      errorId="err-goals-carbs"
      [invalid]="carbsInvalid()"
      errorMessage="Carbs cần từ 0 đến 1000 g"
    >
      <input
        id="goals-field-carbs"
        class="input-native"
        type="number"
        inputmode="numeric"
        placeholder="Tự động"
        [attr.aria-invalid]="carbsInvalid() ? 'true' : null"
        [attr.aria-describedby]="carbsInvalid() ? 'err-goals-carbs' : null"
        [ngModel]="carbs()"
        (ngModelChange)="setCarbs($event)"
      />
    </app-form-field>

    <app-form-field
      label="Fat (g/ngày)"
      inputId="goals-field-fat"
      errorId="err-goals-fat"
      [invalid]="fatInvalid()"
      errorMessage="Fat cần từ 0 đến 1000 g"
    >
      <input
        id="goals-field-fat"
        class="input-native"
        type="number"
        inputmode="numeric"
        placeholder="Tự động"
        [attr.aria-invalid]="fatInvalid() ? 'true' : null"
        [attr.aria-describedby]="fatInvalid() ? 'err-goals-fat' : null"
        [ngModel]="fat()"
        (ngModelChange)="setFat($event)"
      />
    </app-form-field>

    <ion-button fill="clear" size="small" class="reset-button reset-button--text" (click)="reset()">
      Reset về đề xuất
    </ion-button>

    <p class="form-hint">
      Khi đổi mục tiêu, hệ thống đề xuất Calo và Protein mới. Bạn có thể chỉnh tay sau đó. Carbs và
      Fat luôn nhập tay (để trống = tự động theo Phase 3 tracking).
    </p>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="sticky-save-bar">
    <ion-button
      expand="block"
      class="save-button"
      [color]="formInvalid() ? 'medium' : 'primary'"
      [disabled]="formInvalid()"
      (click)="save()"
    >
      Lưu
    </ion-button>
  </div>
</ion-footer>
