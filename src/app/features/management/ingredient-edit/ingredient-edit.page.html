<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/management" />
    </ion-buttons>
    <ion-title>{{ isEdit() ? 'Sửa nguyên liệu' : 'Thêm nguyên liệu' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="form-content">
    @if (!isEdit()) {
      <app-ai-offline-banner />
      <button
        type="button"
        class="btn-ai-lookup"
        data-testid="btn-ask-ai"
        [disabled]="aiLoading()"
        (click)="onAskAi()"
      >
        @if (aiLoading()) {
          <ion-spinner name="crescent" />
          <span>Đang hỏi AI...</span>
        } @else {
          <ion-icon name="sparkles-outline" aria-hidden="true" />
          <span>Hỏi AI điền dinh dưỡng</span>
        }
      </button>
    }

    <app-form-field
      label="Tên nguyên liệu"
      inputId="ingr-field-name"
      errorId="err-ingr-name"
      [invalid]="showErrors() && ingredientForm.name().errors().length > 0"
      [errorMessage]="ingredientForm.name().errors()[0]?.message ?? ''"
    >
      <input
        id="ingr-field-name"
        class="input-native"
        #nameInput
        [formField]="ingredientForm.name"
        [attr.aria-invalid]="
          showErrors() && ingredientForm.name().errors().length > 0 ? 'true' : null
        "
        [attr.aria-describedby]="
          showErrors() && ingredientForm.name().errors().length > 0 ? 'err-ingr-name' : null
        "
      />
    </app-form-field>

    <app-form-field
      label="Nhóm"
      inputId="ingr-field-category"
      errorId="err-ingr-category"
      [invalid]="showErrors() && ingredientForm.category().errors().length > 0"
      [errorMessage]="ingredientForm.category().errors()[0]?.message ?? ''"
    >
      <button
        type="button"
        id="ingr-field-category"
        class="picker-trigger--floating"
        (click)="openCategoryPicker()"
        [attr.aria-invalid]="
          showErrors() && ingredientForm.category().errors().length > 0 ? 'true' : null
        "
        [attr.aria-describedby]="
          showErrors() && ingredientForm.category().errors().length > 0 ? 'err-ingr-category' : null
        "
      >
        <span>{{ formSignal().category || 'Chọn nhóm nguyên liệu' }}</span>
        <ion-icon name="chevron-down-outline" aria-hidden="true" />
      </button>
    </app-form-field>

    <div class="section-label">Thông tin dinh dưỡng (per 100g)</div>
    <p class="section-hint">Nhập trị số dinh dưỡng cho mỗi 100 g nguyên liệu.</p>

    <app-form-field
      label="Calories (kcal)"
      inputId="ingr-field-calories"
      errorId="err-ingr-calories"
      [invalid]="showErrors() && ingredientForm.calories().errors().length > 0"
      [errorMessage]="caloriesErrorMessage()"
    >
      <input
        id="ingr-field-calories"
        class="input-native"
        type="number"
        inputmode="decimal"
        [formField]="ingredientForm.calories"
        step="0.1"
        [attr.aria-invalid]="
          showErrors() && ingredientForm.calories().errors().length > 0 ? 'true' : null
        "
        [attr.aria-describedby]="
          showErrors() && ingredientForm.calories().errors().length > 0 ? 'err-ingr-calories' : null
        "
      />
    </app-form-field>

    <div class="nutrition-grid">
      <app-form-field
        label="Protein (g)"
        inputId="ingr-field-protein"
        [invalid]="showErrors() && ingredientForm.protein().errors().length > 0"
        [errorMessage]="ingredientForm.protein().errors()[0]?.message ?? ''"
      >
        <input
          id="ingr-field-protein"
          class="input-native"
          type="number"
          inputmode="decimal"
          [formField]="ingredientForm.protein"
          step="0.1"
        />
      </app-form-field>
      <app-form-field
        label="Carbs (g)"
        inputId="ingr-field-carbs"
        [invalid]="showErrors() && ingredientForm.carbs().errors().length > 0"
        [errorMessage]="ingredientForm.carbs().errors()[0]?.message ?? ''"
      >
        <input
          id="ingr-field-carbs"
          class="input-native"
          type="number"
          inputmode="decimal"
          [formField]="ingredientForm.carbs"
          step="0.1"
        />
      </app-form-field>
      <app-form-field
        label="Fat (g)"
        inputId="ingr-field-fat"
        [invalid]="showErrors() && ingredientForm.fat().errors().length > 0"
        [errorMessage]="ingredientForm.fat().errors()[0]?.message ?? ''"
      >
        <input
          id="ingr-field-fat"
          class="input-native"
          type="number"
          inputmode="decimal"
          [formField]="ingredientForm.fat"
          step="0.1"
        />
      </app-form-field>
      <app-form-field
        label="Chất xơ (g)"
        inputId="ingr-field-fiber"
        [invalid]="showErrors() && ingredientForm.fiber().errors().length > 0"
        [errorMessage]="ingredientForm.fiber().errors()[0]?.message ?? ''"
      >
        <input
          id="ingr-field-fiber"
          class="input-native"
          type="number"
          inputmode="decimal"
          [formField]="ingredientForm.fiber"
          step="0.1"
        />
      </app-form-field>
    </div>

    @if (isEdit()) {
      <button
        type="button"
        class="btn-outline btn-outline--full"
        data-testid="open-dishes-using-sheet"
        (click)="openDishesSheet()"
      >
        Xem các món đang dùng nguyên liệu này
      </button>
    }

    <button type="button" class="btn-cta" [disabled]="saving()" (click)="onSave()">
      {{ saving() ? 'Đang lưu...' : isEdit() ? 'Lưu thay đổi' : 'Lưu nguyên liệu' }}
    </button>

    @if (isEdit()) {
      <button type="button" class="btn-danger-text" (click)="openDeleteDialog()">
        Xóa nguyên liệu
      </button>
    }
  </div>

  @if (isEdit() && ingredientId(); as id) {
    <app-dishes-using-sheet
      [ingredientId]="id"
      [isOpen]="isDishesSheetOpen()"
      (dishSelected)="onDishSelectedFromSheet($event)"
      (closed)="onDishesSheetClosed()"
    />
  }

  <app-confirm-dialog
    [isOpen]="pendingDeleteId() !== null"
    [title]="
      deleteReferenceLoading()
        ? 'Đang kiểm tra...'
        : deleteReferenceCount() > 0
          ? 'Không thể xóa'
          : 'Xóa nguyên liệu?'
    "
    [message]="
      deleteReferenceLoading()
        ? 'Đang kiểm tra món ăn đang dùng nguyên liệu này.'
        : deleteReferenceCount() > 0
          ? 'Nguyên liệu này đang được dùng trong ' + deleteReferenceCount() + ' món ăn.'
          : 'Bạn có chắc muốn xóa nguyên liệu này? Thao tác này không thể hoàn tác.'
    "
    [cancelLabel]="deleteReferenceCount() > 0 ? 'Đóng' : 'Giữ lại'"
    [confirmLabel]="
      deleteReferenceLoading() ? 'Đang kiểm tra...' : deleteReferenceCount() > 0 ? 'Đóng' : 'Xóa'
    "
    [confirmVariant]="deleteReferenceCount() > 0 || deleteReferenceLoading() ? 'primary' : 'danger'"
    (cancelled)="closeDeleteDialog()"
    [confirmDisabled]="deleteReferenceLoading()"
    (confirmed)="confirmDelete()"
  />

  <app-confirm-dialog
    [isOpen]="discardDialogOpen()"
    title="Bỏ thay đổi?"
    message="Bạn có thay đổi chưa lưu. Nếu rời khỏi màn hình này, các thay đổi sẽ bị mất."
    cancelLabel="Ở lại"
    confirmLabel="Bỏ thay đổi"
    confirmVariant="danger"
    (cancelled)="cancelDiscardChanges()"
    (confirmed)="confirmDiscardChangesDialog()"
  />

  <app-ai-lookup-sheet
    [isOpen]="aiSheetOpen()"
    [result]="aiResult()"
    [mode]="aiSheetMode()"
    [existingIngredientId]="aiExistingId()"
    (saved)="onAiSheetSaved($event)"
    (dismissed)="onAiSheetDismissed()"
  />

  <app-bottom-sheet-picker
    #categoryPicker
    title="Chọn nhóm nguyên liệu"
    [value]="formSignal().category"
    [options]="categoryOptions"
    (valueChange)="onCategorySelected($event)"
  />
</ion-content>
