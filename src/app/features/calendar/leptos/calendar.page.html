<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Lịch ăn</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openSettings()" aria-label="Cài đặt">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <div #controls class="calendar-controls"></div>
</ion-header>
<ion-content [fullscreen]="true">
  <app-leptos-calendar-body #body [attr.data-calendar-renderer]="renderer() ? 'leptos' : null" />
  <div #undo class="undo-toast" slot="fixed" [style.display]="activeUndo() ? null : 'none'"></div>
</ion-content>

<app-confirm-dialog
  [isOpen]="copyWeekConfirmationOpen()"
  title="Sao chép tuần trước?"
  message="Món chưa ăn ở các ngày được sao chép sẽ bị thay thế. Món đã ăn được giữ nguyên."
  cancelLabel="Hủy"
  confirmLabel="Sao chép"
  (cancelled)="onCancelCopyPreviousWeek()"
  (confirmed)="onConfirmCopyPreviousWeek()"
/>

<app-confirm-eat-modal
  [isOpen]="confirmModalOpen()"
  [mode]="confirmMode()"
  [dishName]="confirmDishName()"
  (confirmed)="onConfirm()"
  (cancelled)="onCancel()"
/>

<app-date-picker-modal
  [isOpen]="datePickerOpen()"
  [initialDate]="store.currentDate()"
  (dateSelected)="onDatePicked($event)"
  (dismissed)="onDatePickerDismiss()"
/>

<app-dish-context-menu-modal
  [isOpen]="contextMenuOpen()"
  [dishName]="contextMenuDishName()"
  [canEditServings]="contextMenuCanEditServings()"
  (actionSelected)="onContextAction($event)"
  (dismissed)="onContextMenuDismiss()"
/>

<app-meal-slot-picker-modal
  [isOpen]="choosingNewMeal()"
  title="Thêm món vào bữa nào?"
  (slotSelected)="addToChosenMeal($event)"
  (dismissed)="choosingNewMeal.set(false)"
/>

<app-meal-slot-picker-modal
  [isOpen]="slotPickerOpen()"
  [current]="slotPickerCurrent()"
  title="Di chuyển sang bữa nào?"
  (slotSelected)="onSlotPicked($event)"
  (dismissed)="onSlotPickerDismiss()"
/>

<app-date-picker-modal
  [isOpen]="copyToDatePickerOpen()"
  [initialDate]="store.currentDate()"
  (dateSelected)="onCopyDatePicked($event)"
  (dismissed)="onCopyDatePickerDismiss()"
/>

<app-leptos-logging-picker
  [isOpen]="loggingModalOpen()"
  [mealLabel]="loggingMealLabel()"
  [allDishes]="dishStore.dishes()"
  [recentDishes]="recentLoggedDishes()"
  [loading]="loggingLoading() || dishStore.loading()"
  [aiSuggestions]="loggingAiSuggestions()"
  [aiLoading]="loggingAiLoading()"
  [aiDisabledReason]="loggingAiDisabledReason()"
  (dishSelected)="onLoggingDishSelected($event)"
  (aiSuggestionsRequested)="onLoggingAiSuggestionsRequested()"
  (createDishRequested)="onCreateDishRequested()"
  (dismissed)="onLoggingDismiss()"
/>
