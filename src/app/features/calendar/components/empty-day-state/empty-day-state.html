<section class="empty-day" aria-label="Ngày trống — gợi ý lên kế hoạch">
  <ion-icon class="empty-day__icon" name="calendar-clear-outline" aria-hidden="true" />
  <h2 class="empty-day__title">Ngày này chưa có món nào</h2>
  <p class="empty-day__subtitle">Bắt đầu lên kế hoạch hoặc sao chép từ hôm qua.</p>

  <div class="empty-day__actions">
    <button
      type="button"
      class="empty-day__btn empty-day__btn--primary"
      (click)="planClicked.emit()"
    >
      <ion-icon name="add-circle-outline" aria-hidden="true" />
      <span>Lên kế hoạch</span>
    </button>

    <button type="button" class="empty-day__btn" (click)="copyDeferred.emit()">
      <ion-icon name="copy-outline" aria-hidden="true" />
      <span>Sao chép từ hôm qua</span>
    </button>

    <button type="button" class="empty-day__btn empty-day__btn--ghost" (click)="aiDeferred.emit()">
      <ion-icon name="sparkles-outline" aria-hidden="true" />
      <span>AI chọn món hôm nay</span>
    </button>
  </div>
</section>
