@if (isOpen()) {
  <div class="dialog-backdrop">
    <section
      class="dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-eat-title"
      aria-describedby="confirm-eat-body"
    >
      <h2 id="confirm-eat-title" class="dialog-title">{{ title() }}</h2>
      <p id="confirm-eat-body" class="dialog-message">{{ body() }}</p>
      @if (hybridMicrocopy(); as micro) {
        <p class="dialog-microcopy">{{ micro }}</p>
      }
      <div class="dialog-actions">
        <button type="button" class="dialog-btn-cancel" (click)="cancel()">Hủy</button>
        <button type="button" class="dialog-btn-primary" (click)="confirm()">Xác nhận</button>
      </div>
    </section>
  </div>
}
