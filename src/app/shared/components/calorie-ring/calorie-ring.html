<svg
  class="calorie-ring"
  [class]="'calorie-ring--' + colorClass()"
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 100 100"
  role="img"
  [attr.aria-label]="ariaLabel()"
>
  <circle
    class="calorie-ring__track"
    cx="50"
    cy="50"
    [attr.r]="radius()"
    [attr.stroke-width]="strokeWidth()"
    fill="none"
  ></circle>
  <circle
    class="calorie-ring__fill"
    cx="50"
    cy="50"
    [attr.r]="radius()"
    [attr.stroke-width]="strokeWidth()"
    fill="none"
    [attr.stroke-dasharray]="circumference()"
    [attr.stroke-dashoffset]="dashOffset()"
    transform="rotate(-90 50 50)"
  ></circle>
  @if (showCenterLabel()) {
    <text class="calorie-ring__label" x="50" y="55" text-anchor="middle">{{ value() }}</text>
  }
</svg>
