@if (isOpen()) {
  <div class="msp-backdrop" tabindex="-1" (keydown.escape)="dismiss()">
    <button
      type="button"
      class="msp-backdrop__dismiss"
      aria-label="Đóng chọn bữa"
      (click)="dismiss()"
    ></button>
    <dialog class="msp-sheet" open aria-modal="true" aria-labelledby="msp-title">
      <h2 id="msp-title" class="msp-title">{{ title() }}</h2>
      <div class="msp-grid">
        @for (choice of choices; track choice.type) {
          <button
            type="button"
            class="msp-chip"
            [class.is-current]="current() === choice.type"
            (click)="pick(choice.type)"
            [attr.aria-pressed]="current() === choice.type"
          >
            <span class="msp-chip-label">{{ choice.label }}</span>
          </button>
        }
      </div>
      <button type="button" class="msp-cancel" (click)="dismiss()">Huỷ</button>
    </dialog>
  </div>
}
