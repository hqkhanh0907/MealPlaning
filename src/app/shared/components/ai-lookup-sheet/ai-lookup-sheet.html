<ion-modal
  [isOpen]="isOpen"
  [breakpoints]="[0, 0.85, 1]"
  [initialBreakpoint]="0.85"
  [handle]="true"
  (ionModalDidDismiss)="onIonDismiss()"
>
  <ng-template>
    <ion-header class="als-header">
      <ion-toolbar class="als-toolbar">
        <ion-title class="als-title">Kết quả AI</ion-title>
        <button slot="end" type="button" class="als-close" aria-label="Đóng" (click)="onCancel()">
          <ion-icon name="close-outline" />
        </button>
      </ion-toolbar>
    </ion-header>

    <ion-content class="als-content">
      @if (resultView(); as r) {
        <div class="als-form">
          @if (mode === 'update') {
            <div class="als-update-banner" role="status">
              Đang cập nhật <strong>"{{ r.name }}"</strong> đã có trong DB
            </div>
          }

          <div class="als-confidence" [class]="confidenceClass()">
            {{ confidenceLabel() }}
          </div>

          <app-form-field
            label="Tên nguyên liệu"
            inputId="als-name"
            [invalid]="showErrors() && nameInvalid()"
            errorMessage="Vui lòng nhập tên nguyên liệu"
          >
            <input
              id="als-name"
              class="input-native"
              type="text"
              [ngModel]="form().name"
              (ngModelChange)="updateField('name', $event)"
            />
          </app-form-field>

          <app-form-field label="Nhóm" inputId="als-category">
            <button
              type="button"
              id="als-category"
              class="picker-trigger--floating"
              (click)="openCategoryPicker()"
            >
              <span>{{ form().category || 'Chọn nhóm' }}</span>
              <ion-icon name="chevron-down-outline" aria-hidden="true" />
            </button>
          </app-form-field>

          <div class="als-grid">
            <app-form-field label="Calories (kcal/100g)" inputId="als-cal">
              <input
                id="als-cal"
                class="input-native"
                type="number"
                inputmode="decimal"
                min="0"
                [ngModel]="form().calories"
                (ngModelChange)="updateField('calories', +$event)"
              />
            </app-form-field>

            <app-form-field label="Protein (g/100g)" inputId="als-pro">
              <input
                id="als-pro"
                class="input-native"
                type="number"
                inputmode="decimal"
                min="0"
                [ngModel]="form().protein"
                (ngModelChange)="updateField('protein', +$event)"
              />
            </app-form-field>

            <app-form-field label="Carbs (g/100g)" inputId="als-car">
              <input
                id="als-car"
                class="input-native"
                type="number"
                inputmode="decimal"
                min="0"
                [ngModel]="form().carbs"
                (ngModelChange)="updateField('carbs', +$event)"
              />
            </app-form-field>

            <app-form-field label="Fat (g/100g)" inputId="als-fat">
              <input
                id="als-fat"
                class="input-native"
                type="number"
                inputmode="decimal"
                min="0"
                [ngModel]="form().fat"
                (ngModelChange)="updateField('fat', +$event)"
              />
            </app-form-field>

            <app-form-field label="Fiber (g/100g)" inputId="als-fib">
              <input
                id="als-fib"
                class="input-native"
                type="number"
                inputmode="decimal"
                min="0"
                [ngModel]="form().fiber"
                (ngModelChange)="updateField('fiber', +$event)"
              />
            </app-form-field>
          </div>

          <div class="als-actions">
            <button type="button" class="als-btn als-btn--ghost" (click)="onCancel()">Hủy</button>
            <button
              type="button"
              class="als-btn als-btn--primary"
              [disabled]="!canSave()"
              (click)="onSave()"
            >
              Lưu
            </button>
          </div>
        </div>
      }

      <app-bottom-sheet-picker
        #categoryPicker
        title="Chọn nhóm nguyên liệu"
        [value]="form().category"
        [options]="categoryOptions"
        (valueChange)="onCategorySelected($event)"
      />
    </ion-content>
  </ng-template>
</ion-modal>
