@if (isOpen()) {
  <div class="sheet-backdrop" tabindex="-1" (keydown.escape)="dismiss()">
    <button
      type="button"
      class="sheet-backdrop__dismiss"
      aria-label="Đóng menu món ăn"
      (click)="dismiss()"
    ></button>
    <dialog class="sheet" open aria-modal="true" aria-labelledby="dish-ctx-title">
      <header class="sheet-header">
        <h2 id="dish-ctx-title" class="sheet-title">{{ dishName() }}</h2>
      </header>
      <ul class="sheet-actions">
        <li>
          <button type="button" class="sheet-action" (click)="select('copy')">
            <ion-icon class="sheet-action-icon" name="copy-outline" aria-hidden="true" />
            <span class="sheet-action-label">Sao chép sang ngày khác</span>
          </button>
        </li>
        <li>
          <button type="button" class="sheet-action" (click)="select('move')">
            <ion-icon class="sheet-action-icon" name="swap-horizontal-outline" aria-hidden="true" />
            <span class="sheet-action-label">Di chuyển sang bữa khác</span>
          </button>
        </li>
        <li>
          <button
            type="button"
            class="sheet-action sheet-action--danger"
            (click)="select('delete')"
          >
            <ion-icon class="sheet-action-icon" name="trash-outline" aria-hidden="true" />
            <span class="sheet-action-label">Xoá khỏi bữa</span>
          </button>
        </li>
      </ul>
      <button type="button" class="sheet-cancel" (click)="dismiss()">Huỷ</button>
    </dialog>
  </div>
}
