@if (isOpen()) {
  <div class="sheet-backdrop" role="presentation" (click)="dismiss()">
    <section
      class="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="dish-ctx-title"
      (click)="$event.stopPropagation()"
    >
      <header class="sheet-header">
        <h2 id="dish-ctx-title" class="sheet-title">{{ dishName() }}</h2>
      </header>
      <ul class="sheet-actions" role="menu">
        <li role="none">
          <button type="button" role="menuitem" class="sheet-action" (click)="select('copy')">
            <span class="sheet-action-icon" aria-hidden="true">📋</span>
            <span class="sheet-action-label">Sao chép sang ngày khác</span>
          </button>
        </li>
        <li role="none">
          <button type="button" role="menuitem" class="sheet-action" (click)="select('move')">
            <span class="sheet-action-icon" aria-hidden="true">↔️</span>
            <span class="sheet-action-label">Di chuyển sang bữa khác</span>
          </button>
        </li>
        <li role="none">
          <button
            type="button"
            role="menuitem"
            class="sheet-action sheet-action--danger"
            (click)="select('delete')"
          >
            <span class="sheet-action-icon" aria-hidden="true">🗑️</span>
            <span class="sheet-action-label">Xoá khỏi bữa</span>
          </button>
        </li>
      </ul>
      <button type="button" class="sheet-cancel" (click)="dismiss()">Huỷ</button>
    </section>
  </div>
}
