<app-form-field
  label="Tuổi"
  [inputId]="idPrefix() + '-age'"
  [invalid]="!birthDate() && !!errorMessage()"
  [errorMessage]="errorMessage() || ''"
  [errorId]="errorId()"
>
  <input
    #ageInput
    class="input-native"
    type="number"
    inputmode="numeric"
    [id]="idPrefix() + '-age'"
    [attr.data-testid]="ageTestId()"
    [min]="limits.min"
    [max]="limits.max"
    step="1"
    [readOnly]="!!birthDate()"
    [value]="age() ?? ''"
    (input)="changeAge(ageInput.valueAsNumber)"
    [attr.aria-invalid]="!birthDate() && errorMessage() ? 'true' : null"
    [attr.aria-describedby]="!birthDate() && errorMessage() ? errorId() : idPrefix() + '-age-hint'"
  />
</app-form-field>
<app-form-field
  label="Ngày sinh (tùy chọn)"
  [inputId]="idPrefix() + '-birth-date'"
  [invalid]="!!birthDate() && !!errorMessage()"
  [errorMessage]="
    age() === null ? 'Ngày sinh cần hợp lệ và không ở tương lai.' : errorMessage() || ''
  "
  [errorId]="errorId()"
>
  <input
    #dateInput
    class="input-native"
    type="date"
    [id]="idPrefix() + '-birth-date'"
    [max]="today()"
    [value]="birthDate()"
    (input)="changeDate(dateInput.value)"
    [attr.aria-invalid]="birthDate() && errorMessage() ? 'true' : null"
    [attr.aria-describedby]="birthDate() && errorMessage() ? errorId() : idPrefix() + '-age-hint'"
  />
</app-form-field>
@if (birthDate()) {
  <p [id]="idPrefix() + '-age-hint'">Tuổi tự cập nhật vào sinh nhật.</p>
  <button class="clear-date" type="button" (click)="changeDate('')">
    Xóa ngày sinh để nhập tuổi
  </button>
} @else {
  <p [id]="idPrefix() + '-age-hint'">Điền ngày sinh để tuổi tự cập nhật vào sinh nhật.</p>
}
