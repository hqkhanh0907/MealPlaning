<div class="measurements"><ng-content /></div>
<app-birth-date-field
  class="inline-age"
  [idPrefix]="idPrefix()"
  [errorId]="errorPrefix() + '-birth-date'"
  [birthDate]="birthDate()"
  [errorMessage]="dateError()"
  (edited)="birthDateChange.emit($event)"
/>
<fieldset
  class="gender"
  aria-label="Giới tính"
  [attr.aria-describedby]="genderError() ? errorPrefix() + '-gender' : null"
>
  <legend>Giới tính</legend>
  <div class="gender-options">
    @for (option of options; track option) {
      <label>
        <input
          type="radio"
          role="radio"
          [name]="idPrefix() + '-gender'"
          [value]="option"
          [checked]="gender() === option"
          (change)="genderChange.emit(option)"
        />
        {{ labels[option] }}
      </label>
    }
  </div>
  @if (genderError()) {
    <div [id]="errorPrefix() + '-gender'" class="field-error" role="alert">{{ genderError() }}</div>
  }
</fieldset>
